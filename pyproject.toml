[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "densityjax"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["jax[cpu]", "numpy"]

[project.optional-dependencies]
test = ["pytest", "black"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["densityjax"]

[tool.setuptools.package-data]
"densityjax" = ["py.typed"]
